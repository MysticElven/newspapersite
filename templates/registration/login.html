{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
    Log In
{% endblock %}

{% block content %}
    <h2>Log In</h2>
    <form action="" method="POST">
        {% csrf_token %}
        <div class="form-group"></div>
        {{ form|crispy }}
        <button class="btn btn-success ms-2" type="submit">Log In</button>
    </form>
    <p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
{% endblock %}
